enabled: true

# The Auction House is the player-to-player market layer above /worth.
# Worth is shown as a reference only; players remain free to choose their price.

database:
  mirror:
    # Non-blocking MariaDB mirror for website/read access.
    # Local atomic AH storage remains authoritative for gameplay.
    enabled: true

    # Reuse the live MariaDB credentials already used by WebProfiles.
    # Do not copy database passwords into this file.
    settings-file: webprofiles.yml

    # Created automatically by the Minecraft server when the DB user has
    # CREATE TABLE permission.
    table: mineacle_auction_listings

    # Full reconciliation catches missed writes and updates ACTIVE/EXPIRED.
    sync-seconds: 60

browse:
  default-sort: LOWEST_PRICE

  # Normal click opens review. Shift-click buys immediately.
  shift-click-quick-buy: true

listing:
  # Preserve current behavior until the dedicated LuckPerms permission pass.
  allow-default: true

  default-slots: 18
  elevated-slots: 27
  admin-slots: 999

  # Long-term capability authority.
  elevated-permission: mineacle.plus

  # TEMPORARY bridge while LuckPerms groups only have weights/prefixes.
  # Remove after capability permissions are assigned.
  legacy-primary-group-fallback: true
  legacy-elevated-primary-groups:
    - plus
    - mineacleplus

  min-price: 1
  max-price: 1B

  # Listings expire after exactly 24 hours.
  # Expired listings remain in their owner's slots until manually reclaimed.

  reject-overstacked: true
  block-filled-containers: true
  max-item-nbt-bytes: 262144

  blocked-materials:
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - BARRIER
    - LIGHT
    - DEBUG_STICK
    - KNOWLEDGE_BOOK

worth:
  show-reference: true
  cache-millis: 3000

search:
  prompt-timeout-seconds: 60
  max-length: 48

audit:
  enabled: true

search-aliases:
  cobble: cobblestone
  stonebrick: stone bricks
  gapple: golden apple
  egap: enchanted golden apple
  epearl: ender pearl
  pearl: ender pearl
  xp: experience bottle
  exp: experience bottle
  prot: protection
  sharp: sharpness
  eff: efficiency
  unb: unbreaking
  mend: mending
  dia: diamond
  netherite: netherite

