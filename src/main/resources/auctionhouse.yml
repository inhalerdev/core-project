enabled: true

# The Auction House is Mineacle's player-to-player market above /sell and /worth.
# Local atomic listing/recovery files are authoritative for gameplay. MariaDB is
# an asynchronous read mirror for the website and must never block player trades.

database:
  mirror:
    enabled: true

    # Reuse the live MariaDB credentials already used by WebProfiles.
    # Do not copy database passwords into this file.
    settings-file: webprofiles.yml
    table: mineacle_auction_listings

    # Full reconciliation repairs dropped incremental mirror writes and refreshes
    # ACTIVE/EXPIRED status. Gameplay remains available if MariaDB is offline.
    sync-seconds: 60

    # Mirror work is intentionally bounded. If the remote database stalls, old
    # incremental work may be discarded and the next full reconciliation repairs it.
    queue-capacity: 128
    connect-timeout-millis: 3000
    socket-timeout-millis: 5000
    failure-backoff-seconds: 15

    # Reuses immutable serialized listing item payloads without allowing the
    # mirror cache to grow without bound. Public seller identity is intentionally
    # resolved fresh on each reconciliation so nickname changes repair DB rows.
    payload-cache-max-bytes: 33554432

browse:
  # Unit price is the most useful default comparison for a competitive market.
  default-sort: LOWEST_UNIT_PRICE

  # Short shared-result caching prevents many players opening the same market view
  # from repeatedly scanning/sorting the same immutable listing set.
  cache-millis: 750

  # Normal click opens review. Shift-click buys immediately.
  shift-click-quick-buy: true

listing:
  allow-default: true

  # Default players can occupy the first 18 listing cells in Your Listings.
  # The expanded permission tier can use all 45 listing cells on one page.
  default-slots: 18
  elevated-slots: 45
  admin-slots: 999

  # Capability authority only. Grant this permission to Plus and Media in
  # LuckPerms rather than checking group/rank names in code.
  elevated-permission: mineacleauctionhouse.slots.45

  min-price: 1
  max-price: 1B

  # Prevent AH -> /sell arbitrage. The exact stack is checked when it is listed
  # and again immediately before a buyer can purchase it.
  enforce-server-sell-floor: true

  # Listings expire after exactly 24 hours. Expired listings remain in their
  # owner's occupied slots until manually reclaimed.
  reject-overstacked: true
  # Filled shulkers are allowed so players can trade container kits and use
  # Mineacle's read-only Shulker Preview inside Auction House. Other filled
  # inventory-bearing block items and filled bundles remain blocked.
  block-filled-containers: true
  allow-filled-shulkers: true
  max-item-nbt-bytes: 262144

  blocked-materials:
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - BARRIER
    - LIGHT
    - DEBUG_STICK
    - KNOWLEDGE_BOOK

worth:
  show-reference: true
  cache-millis: 3000

search:
  prompt-timeout-seconds: 60
  max-length: 48

audit:
  enabled: true

search-aliases:
  cobble: cobblestone
  stonebrick: stone bricks
  gapple: golden apple
  egap: enchanted golden apple
  epearl: ender pearl
  pearl: ender pearl
  xp: experience bottle
  exp: experience bottle
  prot: protection
  sharp: sharpness
  eff: efficiency
  unb: unbreaking
  mend: mending
  dia: diamond
  netherite: netherite

