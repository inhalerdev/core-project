enabled: true

updates:
  # Low-frequency self-heal only. Rank/nickname changes are event-driven.
  audit-ticks: 600

worlds:
  enabled: false
  list:
    - spawn1
    - spawn2
    - spawn3
    - overworld
    - overworld_nether
    - overworld_the_end

rank:
  # Prefix is read directly from LuckPerms cached metadata.
  enabled: true
  fallback: ""

name-color:
  default: "#bbbbbb"
  op: "#B078FF"

suffix: ""

display:
  # Local translation above Paper's passenger mount point.
  vertical-offset: 0.32
  view-range: 1.0
  line-width: 200
  shadowed: true
  see-through: false
  default-background: false
