enabled: true

updates:
  # Low-frequency self-heal only. Rank/nickname/hide changes are event-driven.
  audit-ticks: 600

worlds:
  enabled: false
  list:
    - spawn1
    - spawn2
    - spawn3
    - overworld
    - overworld_nether
    - overworld_the_end

rank:
  enabled: true
  use-placeholderapi: true
  placeholder: "%mineaclerank_prefix%"
  fallback: ""

name-color:
  default: "#bbbbbb"
  op: "#8436FE"

suffix: ""

display:
  # Final visual offset above the player's current bounding box
  vertical-offset: 0.32
  view-range: 1.0
  line-width: 200
  shadowed: true
  see-through: false
  default-background: false
