# MineacleCore Admin Inspect
#
# Security model:
# - Base /invsee and /echest permissions are read-only
# - Live/offline item changes require the matching *.modify permission
# - Hidden/vanished players require mineacleadmin.inspect.hidden
# - Targets marked protected require mineacleadmin.inspect.protected.bypass
# - Offline snapshots fail closed after an unclean player/server session

session-validation-ticks: 20
read-only-feedback-cooldown-millis: 750

live-editing:
  enabled: true
  allow-creative: false
  single-editor-per-target: true
  blocked-actions:
    - CLONE_STACK
    - COLLECT_TO_CURSOR
    - DROP_ALL_CURSOR
    - DROP_ALL_SLOT
    - DROP_ONE_CURSOR
    - DROP_ONE_SLOT
    - UNKNOWN

offline-editing:
  # Safe snapshot/writeback mode. Mineacle does not fabricate an NMS Player or
  # rewrite raw world/playerdata NBT while a player is offline.
  enabled: true

  # Creative inspectors are read-only by default so creative clone/packet
  # behavior cannot become an item source.
  allow-creative: false

  # Authorized offline edits are applied shortly after the target joins, after
  # normal playerdata has loaded. The writeback is protected by a transaction
  # UUID stored in player PDC so a crash cannot replay an already-applied edit.
  apply-delay-ticks: 5

  # The in-memory lookup index is coalesced instead of rewriting the full index
  # on every player quit. Individual player snapshots remain atomic/durable.
  index-flush-ticks: 100

  # Safety invariants:
  # - only one editable offline session exists per target
  # - staff inventory is never a transfer destination/source for offline edits
  # - an unclean online-session marker makes the old snapshot unavailable until
  #   that player reconnects and reaches a clean capture
  # - unresolved target-owned cursor state discards unsaved synthetic edits
  #   instead of risking item loss or duplication

audit:
  enabled: true

  # Keep session open/close auditing and a final slot delta without producing
  # one console line for every normal authorized click or drag.
  log-modifications: false
  max-delta-slots: 24

messages:
  no-permission: '&cYou do not have permission to inspect player inventories'
  usage-inventory: '&cUsage: /invsee <player>'
  usage-ender-chest: '&cUsage: /echest <player>'
  target-unavailable: '&cThat player is unavailable'
  offline-data-unavailable: '&cOffline inventory data is not available for that player yet'
  offline-stale: '&cOffline inventory data is stale — that player must reconnect before it can be inspected'
  protection-refresh: '&cPlayer protection is being verified — try again'
  pending-target-change: '&cThat player already has offline inventory changes waiting to apply'
  recovery-pending: '&cInspection closed — unsaved changes are being safely retried'
  offline-save-failed: '&cOffline inventory changes could not be saved safely — no new changes will be applied'
  self-inventory: '&cYou cannot inspect your own inventory'
  self-ender-chest: '&cYou cannot inspect your own ender chest'
  protected: '&cYou cannot inspect that player'
  edit-locked: '&cThat inventory is already being edited'
  open-failed: '&cCould not open that inventory'
  open-read-only: '&#bbbbbbInspecting &#B078FF%player% &#bbbbbb— &#D0AFFFRead Only'
  open-editable: '&#bbbbbbInspecting &#B078FF%player% &#bbbbbb— &cLive Editing'
  open-offline-read-only: '&#bbbbbbInspecting &#B078FF%player% &#bbbbbb— &#D0AFFFOffline Read Only'
  open-offline-editable: '&#bbbbbbInspecting &#B078FF%player% &#bbbbbb— &cOffline Editing'
  read-only: '&cRead-only inspection'
  downgraded-read-only: '&#bbbbbbInspection changed to &#D0AFFFRead Only'
  blocked-edit-action: '&cThat action is blocked during inspection'
  access-changed: '&cInspection closed — access changed'
  target-left: '&cInspection closed — that player went offline'
  target-died: '&cInspection closed — that player died'
