# =============================================================================
# MineacleCore — Command Security
# =============================================================================
#
# Security is a visibility + hard-block layer.
# LuckPerms and each command-owning plugin remain the authority for access.
#
# CRITICAL REGRESSION RULE:
# Security never filters tab completion after the first space.
# /warp <space>, /team <space>, /sell <space>, etc. remain command-owned.
# =============================================================================

schema-version: 3

enabled: true

manage-permission: mineaclesecurity.admin
bypass-permission: mineaclesecurity.bypass
permission-aware-root-permission: mineaclesecurity.permission-aware-roots

unknown-command-message: '&cThis command does not exist'
reload-message: '&#bbbbbbSecurity reloaded'
usage-message: '&#bbbbbbUsage: &#8436FE/mineaclesecurity reload'
groups-message: '&#bbbbbbActive command groups: &#B078FF%groups%'


# -----------------------------------------------------------------------------
# Performance
# -----------------------------------------------------------------------------
#
# Permission changes can cause Paper to rebuild a player's command tree.
# MineacleCore coalesces duplicate refreshes and drains them through one shared
# queue so mass LuckPerms changes do not rebuild thousands of command trees in
# one tick.
# -----------------------------------------------------------------------------

performance:
  command-tree-refreshes-per-tick: 100


# -----------------------------------------------------------------------------
# Hard Security Rules
# -----------------------------------------------------------------------------

# Namespaced roots are blocked for players so plugin namespaces cannot route
# around the normal command path, e.g. bukkit:plugins or paper:version.
block-namespaced-commands: true

# These roots remain hidden/blocked even for permission-aware staff unless the
# emergency bypass permission is explicitly assigned.
blocked-commands:
  - '?'
  - about
  - icanhasbukkit
  - paper
  - pl
  - plugin
  - pluginlist
  - plugins
  - ver
  - version

# These remain console-only even if a player receives broad permissions or the
# Mineacle Security bypass node.
console-only-commands:
  - ban-ip
  - deop
  - op
  - pardon-ip
  - reload
  - restart
  - rl
  - save-all
  - save-off
  - save-on
  - stop
  - whitelist

# Valid commands/aliases that may still be typed when the owning permission
# allows them, but are intentionally removed from the root command suggestions
# for every player group to keep the client command tree clean.
always-hidden-commands:
  - auction
  - auctionhouse
  - bal
  - balancetop
  - delhome
  - duels
  - ecsee
  - enderchest
  - flyspeed
  - h
  - help
  - homes
  - lobby
  - m
  - mineacle
  - money
  - nametags
  - orders
  - originrtp
  - r
  - renamehome
  - reply
  - teams
  - tell
  - tpadeny
  - tpamenu
  - tphere
  - tpno
  - tpyes
  - w
  - walkspeed
  - warps
  - webprofiles
  - wild
  - wm
  - worldmaintenance


# -----------------------------------------------------------------------------
# Root Visibility Capability Groups
# -----------------------------------------------------------------------------
#
# These are not LuckPerms ranks.
# They are small capability bundles used only for root command presentation.
#
# Normal players use the curated Default/Plus roots below.
#
# Builder/Admin/Developer receive mineaclesecurity.permission-aware-roots.
# For those players, Security respects the command tree Paper and the owning
# plugin already expose from their real LuckPerms permissions, while the hard
# rules and always-hidden aliases above are still enforced.
# -----------------------------------------------------------------------------

groups:
  default:
    permission: ''
    priority: 0
    inherits: []

    visible-commands:
      - ah
      - balance
      - baltop
      - bounty
      - discord
      - duel
      - guide
      - home
      - ignore
      - ignorelist
      - msg
      - order
      - pay
      - rtp
      - rules
      - sell
      - sethome
      - spawn
      - stats
      - store
      - team
      - tpa
      - tpacancel
      - tpaccept
      - tpahere
      - tpauto
      - tpdeny
      - verify
      - warp
      - web
      - worth
      - x

  plus:
    permission: mineacle.plus
    priority: 10
    inherits:
      - default

    visible-commands:
      - fly
      - nick

  inspect-inventory:
    permission: mineacleadmin.invsee
    priority: 80
    inherits: []

    visible-commands:
      - invsee

  inspect-ender-chest:
    permission: mineacleadmin.echest
    priority: 80
    inherits: []

    visible-commands:
      - echest
