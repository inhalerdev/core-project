# =============================================================================
# MineacleCore — Command Security
# =============================================================================
#
# Security is a visibility + hard-block layer.
# LuckPerms and each command-owning plugin remain the authority for access.
#
# CRITICAL REGRESSION RULE:
# Security never filters tab completion after the first space.
# /warp <space>, /team <space>, /sell <space>, etc. remain command-owned.
# =============================================================================

schema-version: 4

enabled: true

manage-permission: mineaclesecurity.admin
bypass-permission: mineaclesecurity.bypass
permission-aware-root-permission: mineaclesecurity.permission-aware-roots

permission-aware-namespaces:
  - worldedit

unknown-command-message: '&cThis command does not exist'
reload-message: '&#bbbbbbSecurity reloaded'
usage-message: '&#bbbbbbUsage: &#8436FE/mineaclesecurity reload'
groups-message: '&#bbbbbbActive command groups: &#B078FF%groups%'

performance:
  command-tree-refreshes-per-tick: 100

block-namespaced-commands: true

blocked-commands:
  - '?'
  - about
  - icanhasbukkit
  - paper
  - pl
  - plugin
  - pluginlist
  - plugins
  - ver
  - version

console-only-commands:
  - ban-ip
  - deop
  - op
  - pardon-ip
  - reload
  - restart
  - rl
  - save-all
  - save-off
  - save-on
  - stop
  - whitelist

always-hidden-commands:
  - auction
  - auctionhouse
  - bal
  - balancetop
  - delhome
  - duels
  - ecsee
  - enderchest
  - flyspeed
  - h
  - help
  - homes
  - lobby
  - m
  - mineacle
  - money
  - nametags
  - orders
  - originrtp
  - r
  - renamehome
  - reply
  - teams
  - tell
  - tpadeny
  - tpamenu
  - tpno
  - tpyes
  - v
  - w
  - walkspeed
  - warps
  - webprofiles
  - wild
  - wm
  - worldmaintenance

groups:
  default:
    permission: ''
    priority: 0
    inherits: []

    visible-commands:
      - ah
      - balance
      - baltop
      - bounty
      - discord
      - duel
      - guide
      - home
      - ignore
      - ignorelist
      - msg
      - order
      - pay
      - rtp
      - rules
      - sell
      - sethome
      - spawn
      - stats
      - store
      - team
      - tpa
      - tpacancel
      - tpaccept
      - tpahere
      - tpauto
      - tpdeny
      - verify
      - warp
      - web
      - worth
      - x

  plus:
    permission: mineacle.plus
    priority: 10
    inherits:
      - default

    visible-commands:
      - fly
      - nick

  inspect-inventory:
    permission: mineacleadmin.invsee
    priority: 80
    inherits: []

    visible-commands:
      - invsee

  inspect-ender-chest:
    permission: mineacleadmin.echest
    priority: 80
    inherits: []

    visible-commands:
      - echest

  admin-teleport:
    permission: mineacleadmin.tp
    priority: 90
    inherits: []

    visible-commands:
      - tp
      - tphere

  staff-vanish:
    permission: mineaclevanish.use
    priority: 90
    inherits: []

    visible-commands:
      - vanish
