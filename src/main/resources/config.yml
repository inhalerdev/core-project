# =============================================================================
# MineacleCore — Main Configuration
# =============================================================================
#
# Player-facing color standard
#   Success / accept:      &a
#   Error / destructive:   &c
#   Primary / titles:      #8436FE
#   Secondary / values:    #B078FF
#   Accent / helper text:  #D0AFFF
#   Body / neutral text:   #bbbbbb
#
# Normal player-facing messages should not end with a period.
# =============================================================================


# -----------------------------------------------------------------------------
# Teleportation
# -----------------------------------------------------------------------------

teleport-perks:
  plus-permission: mineacle.plus
  default-delay-seconds: 5
  plus-delay-seconds: 3
  cancel-distance: 2.0


# -----------------------------------------------------------------------------
# Homes
# -----------------------------------------------------------------------------

homes:
  max-homes:
    default: 3
    plus: 5

  plus-permission: mineacle.plus
  default-name-format: 'Home %id%'

  allowed-worlds:
    enabled: true
    worlds:
      - overworld
      - overworld_nether
      - overworld_the_end

  blocked-worlds:
    - spawn1
    - spawn2
    - spawn3

  teleport:
    delay-seconds: 5
    plus-delay-seconds: 3
    cancel-on-move: true

  delete-confirm:
    timeout-seconds: 5

  team-home:
    enabled: true
    banner-slot: 10
    dye-slot: 19

    teleport-delay-seconds: 5
    plus-teleport-delay-seconds: 3
    cancel-on-move: true

    delete-confirm-timeout-seconds: 5

    allowed-worlds:
      enabled: true
      worlds:
        - overworld
        - overworld_nether
        - overworld_the_end

    blocked-worlds:
      - spawn1
      - spawn2
      - spawn3


# -----------------------------------------------------------------------------
# Teams
# -----------------------------------------------------------------------------

teams:
  enabled: true
  max-members: 45
  ban-days: 7

  invites:
    timeout-seconds: 120


# -----------------------------------------------------------------------------
# TPA
# -----------------------------------------------------------------------------

tpa:
  enabled: true
  request-timeout-seconds: 60
  teleport-delay-seconds: 5
  plus-teleport-delay-seconds: 3
  cancel-on-move: true


# -----------------------------------------------------------------------------
# Punishments
# -----------------------------------------------------------------------------

punish:
  appeal-url: 'https://mineacle.net/appeal'
  case-prefix: MCL

  commands:
    tempban: 'tempban %player% %duration% %reason% Appeal ID: %case_id%'
    permaban: 'ban %player% %reason% Appeal ID: %case_id%'

  reasons:
    cheating:
      name: '&cCheating'
      material: DIAMOND_SWORD
      reason: Cheating

    xray:
      name: '&cX-Ray'
      material: DIAMOND_ORE
      reason: X-Ray

    duping:
      name: '&cDuping'
      material: CHEST
      reason: Duping


# -----------------------------------------------------------------------------
# Economy
# -----------------------------------------------------------------------------

economy:
  enabled: true
  starting-balance: '0'
  save-retry-seconds: 30
  currency-symbol: '$'

  pay:
    enabled: true
    minimum: '0.01'


baltop:
  enabled: true
  gui-title: Balance Top
  entries-per-page: 45


# -----------------------------------------------------------------------------
# Nicknames / Chat
# -----------------------------------------------------------------------------

nickname:
  enabled: true
  show-command-when-disabled: false
  allow-default: false

  plus-permission: mineacle.plus
  permission: mineaclechat.nick

  prefix: '.'
  max-length: 15
  allowed-regex: '^[a-zA-Z0-9_]+$'
  prevent-username-impersonation: true

  default-name-color: '#bbbbbb'
  op-name-color: '#bbbbbb'


chat:
  enabled: true
  format: '%luckperms_prefix%&#bbbbbb%mineacle_chat_displayname%&#bbbbbb: &#bbbbbb%message%'

  worlds:
    mode: grouped
    groups:
      global:
        - spawn1
        - spawn2
        - spawn3
        - overworld
        - overworld_nether
        - overworld_the_end


# -----------------------------------------------------------------------------
# Placeholders
# -----------------------------------------------------------------------------

placeholders:
  empty-slot: '---'

  labels:
    unranked: Unranked
    enabled: Enabled
    disabled: Disabled
    'true': 'true'
    'false': 'false'

  cache:
    refresh-ticks: 600
    maximum-leaderboard-positions: 100

  datetime:
    timezone: America/Chicago
    date-format: 'MM/dd/yy'
    time-format: 'hh:mm'
    datetime-format: 'MM/dd/yy | hh:mm'


# -----------------------------------------------------------------------------
# Random Teleport
# -----------------------------------------------------------------------------
#
# RTP destination discovery remains specialized, but the shared TeleportService
# owns the final countdown and teleport execution.
#
# Post-search countdown:
#   Default:   4 -> 3 -> 2 -> 1
#   Mineacle+: 3 -> 2 -> 1
#
# Wide live world borders may automatically strengthen several search values
# such as edge padding, attempt counts, destination history and spacing.
# -----------------------------------------------------------------------------

origin-rtp:
  enabled: true

  plus:
    permission: mineacle.plus
    priority: true

  cooldown:
    default-seconds: 0
    plus-seconds: 0

  queue:
    process-every-ticks: 10
    max-searches-at-once: 2
    plus-priority-burst: 3

  teleport:
    cancel-on-move: true
    post-teleport-protection-seconds: 5

  search:
    use-world-border: true
    world-border-padding: 32

    minimum-distance-from-world-spawn: 1000
    maximum-distance-from-world-spawn: 0

    center-x: 0
    center-z: 0
    fallback-maximum-radius: 5000

    candidates-per-batch: 4
    max-attempts: 160
    timeout-seconds: 60

    safe-platform-radius: 1
    maximum-ground-height-difference: 2
    hazard-check-radius: 2

    candidate-pool-multiplier: 8
    recent-destination-history: 0
    minimum-recent-destination-distance: 0

  unsafe-blocks:
    - WATER
    - LAVA
    - FIRE
    - SOUL_FIRE
    - CACTUS
    - MAGMA_BLOCK
    - POWDER_SNOW
    - BEDROCK
    - SWEET_BERRY_BUSH
    - WITHER_ROSE
    - CAMPFIRE
    - SOUL_CAMPFIRE
    - POINTED_DRIPSTONE
    - CHORUS_PLANT
    - CHORUS_FLOWER
    - END_GATEWAY
    - END_PORTAL
    - END_PORTAL_FRAME
    - NETHER_PORTAL
    - RESPAWN_ANCHOR
    - TWISTING_VINES
    - TWISTING_VINES_PLANT
    - WEEPING_VINES
    - WEEPING_VINES_PLANT

  destinations:
    overworld:
      enabled: true
      display-name: Overworld
      world: overworld

      search:
        min-y: 60
        max-y: 319
        surface-only: true

    nether:
      enabled: true
      display-name: Nether
      world: overworld_nether

      search:
        min-y: 32
        max-y: 118
        surface-only: false

        minimum-exploration-distance-from-world-spawn: 5000
        fallback-maximum-radius: 29000000

        prefer-unexplored-chunks: true
        candidate-pool-multiplier: 8
        recent-destination-history: 16
        minimum-recent-destination-distance: 4096

        randomized-vertical-search: true
        hazard-check-radius: 2

    end:
      enabled: true
      display-name: The End
      world: overworld_the_end

      search:
        min-y: 48
        max-y: 255
        surface-only: true

        minimum-exploration-distance-from-world-spawn: 5000
        fallback-maximum-radius: 29000000

        prefer-unexplored-chunks: true
        candidate-pool-multiplier: 8
        recent-destination-history: 16
        minimum-recent-destination-distance: 4096

        randomized-vertical-search: false
        hazard-check-radius: 2

  messages:
    disabled: '&cRandom teleport is unavailable for %world%'
    already-active: '&cYou already have an active random teleport'
    queued: '&#bbbbbbRandom teleport queued'
    countdown: '&#bbbbbbTeleporting to &#B078FF%world% &#bbbbbbin &#D0AFFF%seconds%s'
    cooldown: '&cYou can use random teleport again in %seconds%s'
    failed: '&cCould not find a safe spot — try again'
    teleported: '&#bbbbbbRandom teleport complete'
    cancelled-move: '&cTeleport cancelled — you moved'


# -----------------------------------------------------------------------------
# Movement / Spawn Features
# -----------------------------------------------------------------------------

double-jump:
  enabled: true

  worlds:
    - spawn1
    - spawn2
    - spawn3

  cooldown-seconds: 0.75
  upward-velocity: 0.75
  forward-velocity: 1.5

  particles: false
  actionbar-cooldown: false


